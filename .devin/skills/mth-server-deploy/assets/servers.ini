# 服务器启动配置文件 - MTH-Server 线上部署 (C:\Server)
# 由 servers.ini.template 生成, ServerRoot=C:\Server, 布局 x64\Release
# 启停范围按线上后台实际开放游戏收敛 (2026-10-14 后台启用清单, 共 14 款):
#   鱼机 5: 金蟾捕鱼(3)/牛魔王(6)/李逵劈鱼(13)/神龙宝藏(32)/史前巨鳄(33)
#   牌机 6: 火凤凰(5)/金皇冠(14)/大字板(15)/ATT满花版(25)/点石成金(37)/NBA(44)
#   押注 3: 彩金单挑(2)/幸运六狮(10)/奔驰宝马(47)
#   已下线不再启动: 八爪鱼/空中霸王/空战英豪/美人鱼/渔乐无穷/摇钱树/水果机/
#     金鲨银鲨/水果拉霸/明星97/水浒传 (后台重新开放时在此补回对应条目)
#   ServerRobot: 机器人监听进程, 由管道/控制台单独启停, 不参与一键启停

[Common]
ServerRoot=C:\Server
Platform=x64
Configuration=Release
BuildDir=${Platform}\${Configuration}

[Flags]
ServerRobot=true

# 捕鱼游戏
FishCow=true
FishJC=true
FishLikui=true
FishSlbz=true
FishSqje=true

# 牌机游戏
CardDazhi=true
CardKing3=true
CardNBA=true
CardPhenix=true
CardDscj=true
CardAttMhb=true

# 下注游戏
BetAnimal=true
BetBMW=true
BetDT=true

[Servers]
# 中心服务器必须先启动；启动成功后等待 10 秒再启动其它服务。
CenterServer=${ServerRoot}\ServerCenterNew\${BuildDir}\ServerCenterNew.exe

# 捕鱼游戏
FishCow=${ServerRoot}\ServerFishCow\${BuildDir}\ServerFishCow.exe
FishJC=${ServerRoot}\ServerFishJC\${BuildDir}\ServerFishJC.exe
FishLikui=${ServerRoot}\ServerFishLikui\${BuildDir}\ServerFishLikui.exe
FishSlbz=${ServerRoot}\ServerFishSlbz\${BuildDir}\ServerFishSlbz.exe
FishSqje=${ServerRoot}\ServerFishSqje\${BuildDir}\ServerFishSqje.exe

# 牌机游戏
CardDazhi=${ServerRoot}\ServerCardDazhi\${BuildDir}\ServerCardDazhi.exe
CardKing3=${ServerRoot}\ServerCardKing3\${BuildDir}\ServerCardKing3.exe
CardNBA=${ServerRoot}\ServerCardNBA\${BuildDir}\ServerCardNBA.exe
CardPhenix=${ServerRoot}\ServerCardPhenix\${BuildDir}\ServerCardPhenix.exe
CardDscj=${ServerRoot}\ServerCardDscj\${BuildDir}\ServerCardDscj.exe
CardAttMhb=${ServerRoot}\ServerCardAttMhb\${BuildDir}\ServerCardAttMhb.exe

# 下注游戏
BetAnimal=${ServerRoot}\ServerBetAnimal\${BuildDir}\ServerBetAnimal.exe
BetBMW=${ServerRoot}\ServerBetBMW\${BuildDir}\ServerBetBMW.exe
BetDT=${ServerRoot}\ServerBetDT\${BuildDir}\ServerBetDT.exe

# 机器人监听进程：仅由控制台"机器人监听进程"选项单独启停，不参与一键启停。
ServerRobot=${ServerRoot}\ServerRobot\${BuildDir}\ServerRobot.exe
