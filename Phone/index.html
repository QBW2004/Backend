    render();
    PAGE_REFRESH.huiyuanyingkui = () => { render(); toast('已刷新', 'success'); };
};

// --------- 玩家充退 ---------
PAGE_RENDERERS.chongzhi = function(page, ps) {
    const presetAccount = ps.presetAccount || '';
    const presetRole = ps.role || 'agent';
    let roleType = presetRole; // agent | player
    let opType = 'recharge';   // recharge | withdraw
    let currentAccountInfo = null;

    page.innerHTML = `
        <div class="container">
            <div class="form-group" style="background:white; border-radius:12px; padding:16px; box-shadow:var(--shadow-card); margin-bottom:16px;">
                <div class="form-group">
                    <label class="form-label">角色类型</label>
                    <div class="option-group flat" id="roleGroup">
                        <div class="option-item ${roleType==='agent'?'active':''}" data-val="agent">下级代理</div>
                        <div class="option-item ${roleType==='player'?'active':''}" data-val="player">玩家</div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">操作类型</label>
                    <div class="option-group flat" id="opGroup">
                        <div class="option-item ${opType==='recharge'?'active':''}" data-val="recharge">充值</div>
                        <div class="option-item ${opType==='withdraw'?'active':''}" data-val="withdraw">退分</div>
                    </div>
                </div>
                <div class="form-group" style="position:relative; margin-bottom: 0;">
                    <label class="form-label">对方账号</label>
                    <div style="display:flex; gap:8px; position:relative;">
                        <input type="text" class="form-input" id="accountInput" placeholder="请输入账号" value="${presetAccount}" autocomplete="off" style="flex:1;">
                        <button class="btn btn-secondary" id="queryBtn" style="flex-shrink:0;">查询</button>
                    </div>
                    <div class="history-list hidden" id="historyList"></div>
                </div>
                <div style="color:var(--primary); font-size:13px; margin:8px 0;">
                    ${ICONS.info.replace('<svg viewBox="0 0 24 24">','<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;">')} 请先查询账号信息,再进行${opType==='recharge'?'充值':'退分'}操作
                </div>
                <div class="account-info" id="accountInfo">
                    <div class="account-info-row"><span class="account-info-label">💎 剩余钻石</span><span class="account-info-value diamond" id="accountDiamond">0</span></div>
                    <div class="account-info-row"><span class="account-info-label">🔢 剩余分数</span><span class="account-info-value score" id="accountScore">0</span></div>
                </div>
            </div>
            <div class="form-group" style="background:white; border-radius:12px; padding:16px; box-shadow:var(--shadow-card); margin-bottom:0;">
                <div class="form-group" style="margin-bottom: 12px;">
                    <label class="form-label" id="amountLabel">充值钻石</label>
                    <input type="number" class="form-input" id="amountInput" placeholder="请输入${opType==='recharge'?'充值':'退分'}钻石数量" inputmode="numeric" pattern="[0-9]*">
                </div>
                <button class="btn btn-primary btn-block-action" id="submitBtn" disabled>${opType==='recharge'?'充值':'退分'}</button>
            </div>
        </div>
    `;

    // 分段控件切换
    $$('#roleGroup .option-item', page).forEach(o => {
        o.onclick = () => {
            $$('#roleGroup .option-item', page).forEach(x => x.classList.remove('active'));
            o.classList.add('active');
            roleType = o.dataset.val;
            resetAccountInfo();
        };
    });
    $$('#opGroup .option-item', page).forEach(o => {
        o.onclick = () => {
            $$('#opGroup .option-item', page).forEach(x => x.classList.remove('active'));
            o.classList.add('active');
            opType = o.dataset.val;
            $('#amountLabel', page).textContent = opType === 'recharge' ? '充值钻石' : '退分钻石';
            $('#amountInput', page).placeholder = `请输入${opType==='recharge'?'充值':'退分'}钻石数量`;
            $('#submitBtn', page).textContent = opType === 'recharge' ? '充值' : '退分';
            resetAccountInfo();
        };
    });

    function resetAccountInfo() {
        currentAccountInfo = null;
        $('#accountInfo', page).classList.remove('show');
        $('#submitBtn', page).disabled = true;
    }

    // 历史下拉
    const historyList = $('#historyList', page);
    const accountInput = $('#accountInput', page);
    function renderHistory() {
        const list = getHistory();
        if (list.length === 0) {
            historyList.innerHTML = '<div class="history-item"><span style="color:var(--text-disabled);">暂无历史记录</span></div>';
        } else {
            historyList.innerHTML = list.map(a => `
                <div class="history-item"><span data-account="${a}">${a}</span><button class="history-delete" data-del="${a}">删除</button></div>
            `).join('') + '<div class="history-clear" id="historyClear">清空历史</div>';
            $$('.history-item span[data-account]', historyList).forEach(s => {
                s.onclick = () => { accountInput.value = s.dataset.account; historyList.classList.add('hidden'); };
            });
            $$('.history-delete', historyList).forEach(d => {
                d.onclick = (e) => {
                    e.stopPropagation();
                    saveHistory(getHistory().filter(a => a !== d.dataset.del));
                    renderHistory();
                };
            });
            $('#historyClear', historyList).onclick = () => { saveHistory([]); renderHistory(); };
        }
    }
    accountInput.onfocus = () => { renderHistory(); historyList.classList.remove('hidden'); };
    accountInput.onblur = () => { setTimeout(() => historyList.classList.add('hidden'), 200); };
    accountInput.oninput = () => resetAccountInfo();

    // 金额只允许数字
    $('#amountInput', page).oninput = (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
    };

    // 查询
    $('#queryBtn', page).onclick = async () => {
        const acc = accountInput.value.trim();
        if (!acc) { toast('请输入账号', 'error'); return; }
        showLoading('查询中...');
        await delay(500);
        hideLoading();
        // 模拟查询
        let diamond, score;
        if (roleType === 'agent') {
            const ag = mockAgents.find(a => a.account === acc);
            if (ag) { diamond = ag.diamond; score = randInt(1000, 50000); }
        } else {
            const pl = mockOnlinePlayers.concat(mockOfflinePlayers).find(p => p.account === acc);
            if (pl) { diamond = pl.diamond; score = pl.score; }
            const mem = mockMembers.find(m => m.account === acc);
            if (mem) { diamond = mem.diamond; score = mem.score; }
        }
        if (diamond == null) {
            // 模拟一个随机账号
            diamond = randInt(100, 9999);
            score = randInt(1000, 50000);
        }
        currentAccountInfo = { account: acc, diamond, score };
        $('#accountDiamond', page).textContent = diamond.toLocaleString();
        $('#accountScore', page).textContent = score.toLocaleString();
        $('#accountInfo', page).classList.add('show');
        $('#submitBtn', page).disabled = false;
        addHistory(acc);
        toast(`查询成功:${acc}`, 'success');
    };

    // 提交
    $('#submitBtn', page).onclick = async () => {
        if (!currentAccountInfo) { toast('请先查询账号', 'error'); return; }
        const amount = parseInt($('#amountInput', page).value);
        if (!amount || amount <= 0) { toast('请输入有效金额', 'error'); return; }
        if (opType === 'recharge' && amount > state.user.diamond) {
            toast(`充值金额不能超过您的余额 ${state.user.diamond} (当前 ${amount})`, 'error'); return;
        }
        if (opType === 'withdraw' && amount > currentAccountInfo.score) {
            toast(`退分金额不能超过对方分数 ${currentAccountInfo.score} (当前 ${amount})`, 'error'); return;
        }
        const btn = $('#submitBtn', page);
        btn.classList.add('loading');
        btn.innerHTML = '<span class="spinner"></span>处理中...';
        showLoading('处理中...');
        await delay(800);
        hideLoading();
        btn.classList.remove('loading');
        btn.textContent = opType === 'recharge' ? '充值' : '退分';
        // 更新数据
        if (opType === 'recharge') {
            currentAccountInfo.diamond += amount;
            state.user.diamond -= amount;
            mockRechargeRecords.unshift({
                operator: state.user.username, playerAccount: currentAccountInfo.account,
                playerName: '', amount, before: currentAccountInfo.diamond - amount,
                after: currentAccountInfo.diamond, time: Math.floor(Date.now()/1000),
                remark: '充值', type: 'recharge'
            });
        } else {
            currentAccountInfo.score -= amount;
            state.user.diamond += amount;
            mockRechargeRecords.unshift({
                operator: state.user.username, playerAccount: currentAccountInfo.account,
                playerName: '', amount: -amount, before: currentAccountInfo.score + amount,
                after: currentAccountInfo.score, time: Math.floor(Date.now()/1000),
                remark: '退分', type: 'withdraw'
            });
        }
        $('#accountDiamond', page).textContent = currentAccountInfo.diamond.toLocaleString();
        $('#accountScore', page).textContent = currentAccountInfo.score.toLocaleString();
        $('#amountInput', page).value = '';
        // 更新顶栏余额
        renderHeader(ROUTES.chongzhi);
        toast(`成功为${roleType==='agent'?'代理':'玩家'} ${currentAccountInfo.account} ${opType==='recharge'?'充值':'退分'} ${amount} 钻石`, 'success');
    };

    // 如果预填了账号,自动查询
    if (presetAccount) {
        setTimeout(() => $('#queryBtn', page).click(), 200);
    }
};

PAGE_RENDERERS.chongzhilist = function(page, ps) {
    let recordType = 'all';
    let curPage = 0;
    const PAGE_SIZE = 20;
    const today = new Date();
    const weekAgo = new Date(today.getTime() - 86400*7*1000);

    function filtered() {
        let list = [...mockRechargeRecords];
        if (recordType !== 'all') list = list.filter(r => r.type === recordType);
        const startStr = $('#fStart', page)?.value;
        const endStr = $('#fEnd', page)?.value;
        const acc = $('#fAccount', page)?.value.trim();
        const op = $('#fOperator', page)?.value.trim();
        if (startStr) {
            const t = new Date(startStr + 'T00:00:00').getTime() / 1000;
            list = list.filter(r => r.time >= t);
        }
        if (endStr) {
            const t = new Date(endStr + 'T23:59:59').getTime() / 1000;
            list = list.filter(r => r.time <= t);
        }
        if (acc) list = list.filter(r => r.playerAccount.includes(acc));
        if (op) list = list.filter(r => r.operator.includes(op));
        return list.sort((a,b) => b.time - a.time);
    }

    function render() {
        const list = filtered();
        const totalRecharge = list.filter(r => r.amount > 0).reduce((s,r) => s+r.amount, 0);
        const totalWithdraw = list.filter(r => r.amount < 0).reduce((s,r) => s+r.amount, 0);
        const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
        if (curPage >= totalPages) curPage = totalPages - 1;
        const slice = list.slice(curPage*PAGE_SIZE, (curPage+1)*PAGE_SIZE);

        page.innerHTML = `
            <div class="container">
                <div class="filter-tabs">
                    <div class="filter-tab ${recordType==='all'?'active':''}" data-type="all">全部</div>
                    <div class="filter-tab ${recordType==='recharge'?'active':''}" data-type="recharge">充值</div>
                    <div class="filter-tab ${recordType==='withdraw'?'active':''}" data-type="withdraw">退分</div>
                </div>
                <div class="card" style="padding:16px; margin-bottom:16px;">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <div class="form-group" style="margin:0;">
                            <label class="form-label">开始日期</label>
                            <input type="date" class="form-input" id="fStart" value="${fmtDate(weekAgo)}">
                        </div>
                        <div class="form-group" style="margin:0;">
                            <label class="form-label">结束日期</label>
                            <input type="date" class="form-input" id="fEnd" value="${fmtDate(today)}">
                        </div>
                        <div class="form-group" style="margin:0;">
                            <label class="form-label">玩家账号</label>
                            <input type="text" class="form-input" id="fAccount" placeholder="可选">
                        </div>
                        <div class="form-group" style="margin:0;">
                            <label class="form-label">操作人</label>
                            <input type="text" class="form-input" id="fOperator" placeholder="可选">
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; gap:8px;">
                        <div style="font-size:13px; display:flex; gap:12px;">
                            <span>总充值: <b class="positive">+${totalRecharge.toLocaleString()}</b></span>
                            <span>总退分: <b class="negative">${totalWithdraw.toLocaleString()}</b></span>
                        </div>
                        <button class="btn btn-primary" id="filterBtn" style="min-width:120px;">筛选</button>
                    </div>
                </div>
                <div class="table-container">
                    <div class="table-scroll">
                    <table class="data-table">
                        <thead><tr><th>操作人</th><th>玩家账号</th><th>玩家名称</th><th>充退数量(钻)</th><th>充退前钻石</th><th>充退后钻石</th><th>充退时间</th><th>备注</th></tr></thead>
                        <tbody>
                            ${slice.length === 0 ? '<tr><td colspan="8" class="no-data">暂无记录</td></tr>' : slice.map(r => `
                                <tr>
                                    <td>${r.operator}</td>
                                    <td><span class="account-link">${r.playerAccount}</span></td>
                                    <td>${r.playerName || '-'}</td>
                                    <td class="amount ${r.amount>=0?'positive':'negative'}">${r.amount>=0?'+':''}${r.amount.toLocaleString()}</td>
                                    <td class="amount">${r.before.toLocaleString()}</td>
                                    <td class="amount">${r.after.toLocaleString()}</td>
                                    <td class="text-muted" style="font-size:12px;">${fmtTime(r.time)}</td>
                                    <td style="font-size:12px;">${r.remark}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    </div>
                </div>
                <div class="pagination">
                    <button id="prevBtn" ${curPage===0?'disabled':''}>上一页</button>
                    <span class="pagination-info">第 ${curPage+1} 页 / 共 ${totalPages} 页</span>
                    <button id="nextBtn" ${curPage>=totalPages-1?'disabled':''}>下一页</button>
                </div>
            </div>
        `;
        $$('.filter-tab', page).forEach(t => {
            t.onclick = () => { recordType = t.dataset.type; curPage = 0; render(); };
        });
        $('#filterBtn', page).onclick = () => { curPage = 0; render(); toast('筛选完成', 'success'); };
        $('#prevBtn', page).onclick = () => { if (curPage > 0) { curPage--; render(); } };
        $('#nextBtn', page).onclick = () => { curPage++; render(); };
    }
    render();
    PAGE_REFRESH.chongzhilist = () => { render(); toast('记录已刷新', 'success'); };
};

    // 初始化日期选择器(今天 00:00 - 23:59)
    function initDates() {
        const today = new Date();
        const p = (n) => String(n).padStart(2, '0');
        const dStr = `${today.getFullYear()}-${p(today.getMonth()+1)}-${p(today.getDate())}`;
        $('#sjStartDate', page).value = `${dStr}T00:00`;
        $('#sjEndDate', page).value = `${dStr}T23:59`;
    }
    initDates();

    // 更新牌型选项(数据格式:"牌型名(倍率)",与原后台一致)
    function updatePatterns(game) {
        const sel = $('#sjPattern', page);
        sel.innerHTML = '<option value="">请选择牌型</option>';
        if (game && PATTERNS[game]) {
            PATTERNS[game].forEach((p, i) => {
                const opt = el('option');
                opt.value = String(i); // 用索引作为 value
                opt.textContent = p;
                // 从括号里提取倍率,作为 data-multiplier
                const mulMatch = p.match(/（(\d+(?:\.\d+)?)/) || p.match(/\((\d+(?:\.\d+)?)/);
                if (mulMatch) opt.dataset.multiplier = mulMatch[1];
                sel.appendChild(opt);
            });
        }
    }

    // 渲染送奖记录
    function renderRecords() {
        const tbody = $('#sjRecordBody', page);
        const empty = $('#sjEmptyRecords', page);
        if (!currentGame) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            empty.textContent = '请先选择游戏查看对应记录';
            return;
        }
        if (mockRewardRecords.length === 0) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            empty.textContent = '暂无送奖记录';
            return;
        }
        empty.style.display = 'none';
        tbody.innerHTML = mockRewardRecords.map(r => {
            const hallTag = HALL_OPTIONS.find(h => h.value === String(r.hall));
            const gameObj = GAME_OPTIONS.find(g => g.value === r.game);
            return `
                <tr>
                    <td>${r.account}</td>
                    <td>${r.status === 'completed' ? '<span class="sj-status-completed">已出</span>' : r.status === 'pending-free' ? '<span class="sj-status-pending-free">待免费</span>' : '<button class="sj-remove-btn" data-idx="' + r.idx + '">移除</button>'}</td>
                    <td><span class="sj-hall-tag sj-hall-${r.hall}">${hallTag ? hallTag.label : r.hall}</span></td>
                    <td>${r.machine || '-'}</td>
                    <td>${r.patternLabel || '-'}</td>
                    <td>${r.actualPatternLabel || '-'}</td>
                    <td class="amount">${r.sendAmount}</td>
                    <td class="amount ${r.actualAmount>=0?'positive':'negative'}">${r.actualAmount>=0?'+':''}${r.actualAmount}</td>
                    <td>${gameObj ? gameObj.label : r.game}</td>
                    <td>${fmtTime(r.time)}</td>
                </tr>
            `;
        }).join('');
        // 绑定移除按钮
        $$('.sj-remove-btn', tbody).forEach(b => {
            b.onclick = async () => {
                if (!await confirm('确定要移除这条送奖记录吗?')) return;
                const idx = parseInt(b.dataset.idx);
                mockRewardRecords = mockRewardRecords.filter(r => r.idx !== idx);
                renderRecords();
                updateSentDiamond();
                toast('已移除', 'success');
            };
        });
    }

    function updateSentDiamond() {
        const total = mockRewardRecords.reduce((s, r) => s + (r.sendAmount || 0), 0);
        $('#sjSentDiamond', page).textContent = total.toLocaleString();
    }

    // 查询玩家输赢信息
    async function queryPlayer() {
        const acc = $('#sjAccount', page).value.trim();
        if (!acc) { toast('请输入玩家账号', 'error'); return; }
        showLoading('查询中...');
        await delay(600);
        hideLoading();
        // 模拟查询
        const allP = mockOnlinePlayers.concat(mockOfflinePlayers);
        const p = allP.find(x => x.account === acc) || mockMembers.find(m => m.account === acc);
        if (p) {
            playerInfo = {
                bet: p.bet || randInt(10, 500),
                todayWinLoss: p.todayWinLoss || randInt(-2000, 2000),
                totalWinLoss: p.totalWinLoss || randInt(-5000, 10000),
            };
        } else {
            // 模拟一个随机玩家
            playerInfo = {
                bet: randInt(10, 500),
                todayWinLoss: randInt(-2000, 2000),
                totalWinLoss: randInt(-5000, 10000),
            };
        }
        $('#sjBet', page).textContent = playerInfo.bet;
        $('#sjBet', page).style.color = 'rgb(153, 153, 153)';
        const twEl = $('#sjTodayWinLoss', page);
        twEl.textContent = (playerInfo.todayWinLoss >= 0 ? '+' : '') + playerInfo.todayWinLoss.toLocaleString();
        twEl.style.color = playerInfo.todayWinLoss >= 0 ? 'var(--success)' : 'var(--danger)';
        const tEl = $('#sjTotalWinLoss', page);
        tEl.textContent = (playerInfo.totalWinLoss >= 0 ? '+' : '') + playerInfo.totalWinLoss.toLocaleString();
        tEl.style.color = playerInfo.totalWinLoss >= 0 ? 'var(--success)' : 'var(--danger)';
        toast(`查询成功:${acc}`, 'success');
    }

    // 加载奖池余额
    async function loadPool() {
        if (!currentGame) {
            $('#sjPool', page).textContent = '--';
            return;
        }
        // 模拟
        poolBalance = randInt(0, 50000);
        $('#sjPool', page).textContent = poolBalance.toLocaleString();
    }

    // 加载记录
    async function loadRecords() {
        if (!currentGame) {
            mockRewardRecords = [];
            renderRecords();
            return;
        }
        // 模拟一些记录
        if (mockRewardRecords.length === 0) {
            for (let i = 0; i < 3; i++) {
                const patterns = PATTERNS[currentGame] || [];
                const randPattern = patterns.length > 0 ? pick(patterns) : '';
                const randActual = patterns.length > 0 && Math.random() > 0.5 ? pick(patterns) : '';
                const mulMatch = randPattern.match(/（(\d+(?:\.\d+)?)/) || randPattern.match(/\((\d+(?:\.\d+)?)/);
                const mul = mulMatch ? parseFloat(mulMatch[1]) : 1;
                const bet = randInt(10, 500);
                mockRewardRecords.push({
                    idx: Date.now() + i,
                    account: presetAccount || `player${randInt(1000, 1004)}`,
                    status: pick(['completed', 'completed', 'pending']),
                    hall: String(randInt(1, 6)),
                    machine: String(randInt(1, 99)),
                    game: currentGame,
                    pokertype: '0',
                    patternLabel: randPattern,
                    actualPattern: randActual ? '0' : null,
                    actualPatternLabel: randActual || null,
                    sendAmount: Math.round(mul * bet),
                    actualAmount: randInt(-500, 500),
                    time: Math.floor(Date.now()/1000) - randInt(60, 86400),
                });
            }
        }
        renderRecords();
        updateSentDiamond();
    }

    // 事件绑定
    $('#sjQueryBtn', page).onclick = queryPlayer;
    $('#sjAccount', page).onkeydown = (e) => { if (e.key === 'Enter') queryPlayer(); };
    $('#sjGame', page).onchange = function() {
        currentGame = this.value;
        updatePatterns(currentGame);
        loadPool();
        mockRewardRecords = []; // 切游戏清空记录
        loadRecords();
    };
    $('#sjRefreshRecordsBtn', page).onclick = () => {
        mockRewardRecords = [];
        loadRecords();
        toast('记录已刷新', 'success');
    };
    $('#sjSubmitBtn', page).onclick = async () => {
        const acc = $('#sjAccount', page).value.trim();
        const game = $('#sjGame', page).value;
        const hall = $('#sjHall', page).value;
        const patternIdx = $('#sjPattern', page).value;
        if (!acc) { toast('请输入玩家账号', 'error'); return; }
        if (!game) { toast('请选择游戏', 'error'); return; }
        if (!hall) { toast('请选择场次', 'error'); return; }
        if (!patternIdx) { toast('请选择牌型', 'error'); return; }
        const btn = $('#sjSubmitBtn', page);
        btn.classList.add('loading');
        btn.disabled = true;
        showLoading('送奖中...');
        await delay(1000);
        hideLoading();
        btn.classList.remove('loading');
        btn.disabled = false;
        // 从选中的 option 拿倍率
        const selectedOpt = $('#sjPattern', page).selectedOptions[0];
        const mul = parseFloat(selectedOpt.dataset.multiplier) || 1;
        const patternLabel = selectedOpt.textContent;
        const bet = playerInfo ? playerInfo.bet : randInt(10, 500);
        const sendAmount = Math.round(mul * bet);
        // 添加到记录
        mockRewardRecords.unshift({
            idx: Date.now(),
            account: acc,
            status: 'pending',
            hall,
            machine: String(randInt(1, 99)),
            game,
            pokertype: patternIdx,
            patternLabel,
            actualPattern: null,
            actualPatternLabel: null,
            sendAmount,
            actualAmount: 0,
            time: Math.floor(Date.now()/1000),
        });
        renderRecords();
        updateSentDiamond();
        // 扣奖池
        if (poolBalance != null) {
            poolBalance -= sendAmount;
            $('#sjPool', page).textContent = poolBalance.toLocaleString();
        }
        toast(`送奖成功,送出 ${sendAmount} 钻石`, 'success');
    };

    // 滑动提示点击关闭
    $('#sjSwipeHint', page).onclick = function() {
        this.classList.add('hide');
        try { localStorage.setItem('sjSawSwipeHint', '1'); } catch {}
    };
    if (localStorage.getItem('sjSawSwipeHint') === '1') {
        $('#sjSwipeHint', page).classList.add('hide');
    }

    // 充值奖池按钮(顶栏)
    PAGE_POOL_ACTION.songjiang = () => showRechargePoolModal();

    async function showRechargePoolModal() {
        if (!currentGame) { toast('请先选择游戏', 'error'); return; }
        showModal({
            title: '充值奖池',
            bodyHTML: `
                <div class="sj-form-group">
                    <label class="sj-form-label">充值金额(钻石)</label>
                    <input type="number" class="sj-form-control" id="sjRechargeAmount" placeholder="正数充值,负数扣减奖池">
                </div>
                <div style="font-size:13px; color:var(--text-tertiary);">当前奖池余额:${poolBalance != null ? poolBalance.toLocaleString() : '--'} 钻</div>
            `,
            actions: [{ label: '确认充值', type: 'recharge', value: 'ok' }],
            cancelText: '取消'
        }).then(async (r) => {
            if (r !== 'ok') return;
            const amount = parseInt($('#sjRechargeAmount').value);
            if (!amount || isNaN(amount)) { toast('请输入有效金额', 'error'); return; }
            if (amount > state.user.diamond) { toast(`充值金额不能超过您的钻石余额 ${state.user.diamond}`, 'error'); return; }
            showLoading('处理中...');
            await delay(800);
            hideLoading();
            poolBalance = (poolBalance || 0) + amount;
            $('#sjPool', page).textContent = poolBalance.toLocaleString();
            if (amount > 0) {
                state.user.diamond -= amount;
                $('#sjMyDiamond', page).textContent = state.user.diamond.toLocaleString();
            }
            toast(`充值${amount > 0 ? '成功' : '扣减成功'},奖池余额 ${poolBalance.toLocaleString()}`, 'success');
        });
    }

    // 如果预填了账号,自动查询
    if (presetAccount) {
        setTimeout(() => queryPlayer(), 200);
    }
};

        <div class="modal-footer"><button class="modal-footer-btn" id="psCancel">关闭</button></div>
    `;
    overlay.appendChild(content);
    $('#modalContainer').appendChild(overlay);
    const close = () => overlay.remove();
    overlay.onclick = (e) => { if (e.target === overlay) close(); };
    $('#psCancel', content).onclick = close;
    const doSearch = () => {
        const kw = $('#psInput', content).value.trim().toLowerCase();
        if (!kw) {
            $('#psResults', content).innerHTML = '<div class="search-result-item">请输入搜索内容</div>';
            return;
        }
        const all = mockOnlinePlayers.concat(mockOfflinePlayers);
        const results = all.filter(p => p.account.toLowerCase().includes(kw) || (p.name||'').toLowerCase().includes(kw));
        const div = $('#psResults', content);
        if (results.length === 0) {
            div.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <div style="color: #666; margin-bottom: 10px;">未找到匹配的玩家</div>
                    <div style="font-size: 12px; color: #999;">请检查输入是否正确,或尝试使用其他搜索词</div>
                    <div style="font-size: 12px; color: #999; margin-top: 10px;">当前搜索词:${kw}</div>
                </div>
            `;
        } else {
            div.innerHTML = results.map(p => {
                const isOnline = mockOnlinePlayers.includes(p);
                return `
                <div class="search-result-item" data-account="${p.account}">
                    <div class="search-result-header">
                        <div class="search-result-account">${p.account}</div>
                        <div class="search-result-name">${p.name}</div>
                        <div class="search-result-status ${isOnline ? 'online' : 'offline'}">${isOnline ? '在线' : '离线'}</div>
                    </div>
                    <div class="search-result-info">剩余分数:${p.score} | 剩余钻石:${p.diamond}</div>
                </div>
                `;
            }).join('');
            $$('.search-result-item', div).forEach(item => {
                item.onclick = () => {
                    const acc = item.dataset.account;
                    close();
                    // 触发玩家操作弹窗(模拟点击卡片)
                    const card = document.querySelector('.player-card[data-account="' + acc + '"]');
                    if (card) card.click();
                };
            });
        }
    };
    $('#psBtn', content).onclick = doSearch;
    $('#psInput', content).onkeydown = (e) => { if (e.key === 'Enter') doSearch(); };
    setTimeout(() => $('#psInput', content).focus(), 100);
}

// 覆盖原来的 showSearchModal
window.showSearchModal = showSearchModalInline;

startApp();
</script>
</body>
</html>
