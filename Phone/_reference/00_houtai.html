<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理后台登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #f9f9f9;
            color: #333;
            min-height: 100vh;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }
        
        .page-container {
            display: flex;
            flex-direction: column;
            padding: 20px;
            height: 100%;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: #fff;
            border-radius: 16px;
            padding: 30px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            margin: 0 auto;
            margin-top: 5vh;
        }
        
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background-color: #007aff;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        
        .logo svg {
            width: 50px;
            height: 50px;
            fill: white;
        }
        
        h1 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1d1d1f;
        }
        
        .subtitle {
            font-size: 15px;
            color: #86868b;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #1d1d1f;
        }
        
        .input-container {
            position: relative;
        }
        
        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s;
        }
        
        input:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #86868b;
            cursor: pointer;
            font-size: 14px;
        }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            background-color: #0077ed;
        }
        
        .login-btn:active {
            transform: scale(0.98);
        }
        
        .login-btn:disabled {
            background-color: #a1a1a6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            color: #ff3b30;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 响应式调整 */
        @media (max-width: 380px) {
            .login-container {
                padding: 24px 16px;
                margin-top: 2vh;
            }
            
            h1 {
                font-size: 22px;
            }
            
            input, .login-btn {
                padding: 12px;
            }
        }
        
        /* 兼容iPhone键盘弹出的情况 */
        @media (max-height: 500px) {
            .login-container {
                margin-top: 0;
            }
            
            .logo {
                width: 60px;
                height: 60px;
                margin-bottom: 10px;
            }
            
            .logo svg {
                width: 35px;
                height: 35px;
            }
            
            h1 {
                font-size: 20px;
                margin-bottom: 4px;
            }
            
            .subtitle {
                font-size: 14px;
                margin-bottom: 15px;
            }
            
            .form-group {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="login-container">
            <div class="logo-container">
                <div class="logo">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                    </svg>
                </div>
                <h1>管理后台</h1>
                <p class="subtitle">请登录您的管理账号</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <div class="input-container">
                        <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
                    </div>
                    <div class="error-message" id="usernameError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="input-container">
                        <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePassword">显示</button>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="loading" id="loadingSpinner"></span>
                    登录
                </button>
                <div class="error-message" id="loginError"></div>
            </form>
        </div>
    </div>
