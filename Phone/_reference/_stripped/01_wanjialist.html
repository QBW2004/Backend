    <style>

        }

            font-weight: 500;
            margin-bottom: 0;

            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;

            background-color: #e5e5ea;
        }

            border-bottom: 1px solid #eaeaea;
        }

            text-align: center;
            padding: 14px 0;

            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

            content: '';

            width: 100%;
        }
        
        .tab-pane.active {
            display: block;
        }

            top: 0;
            left: 0;

            height: 100%;

            transition: opacity 0.3s, visibility 0.3s;
        }

            justify-content: space-between;
            align-items: flex-start;
        }

        }
